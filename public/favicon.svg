<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg-main" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%"   stop-color="#f87171" />
      <stop offset="45%"  stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="lg-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lg-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="f-outer" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="f-text" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#450a0a" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Depth shadow -->
  <circle cx="31.5" cy="32.5" r="26" fill="#450a0a" opacity="0.55" />
  <!-- Main badge -->
  <circle cx="30" cy="30" r="26" fill="url(#lg-main)" filter="url(#f-outer)" />
  <!-- Gloss -->
  <ellipse cx="30" cy="19" rx="19" ry="13" fill="url(#lg-gloss)" />
  <!-- Rim -->
  <circle cx="30" cy="30" r="25.5" stroke="url(#lg-rim)" stroke-width="1.2" fill="none" />
  <!-- Inner ring -->
  <circle cx="30" cy="30" r="21" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none" />
  <!-- 3D text: deep shadow -->
  <text x="32" y="37" text-anchor="middle" fill="#450a0a"
    font-size="22" font-weight="900" font-family="Arial Black, Arial, sans-serif">CM</text>
  <!-- 3D text: mid shadow -->
  <text x="31" y="36" text-anchor="middle" fill="#7f1d1d"
    font-size="22" font-weight="900" font-family="Arial Black, Arial, sans-serif">CM</text>
  <!-- 3D text: white face -->
  <text x="29.5" y="35" text-anchor="middle" fill="white" filter="url(#f-text)"
    font-size="22" font-weight="900" font-family="Arial Black, Arial, sans-serif">CM</text>
  <!-- 3D text: gloss -->
  <text x="29.5" y="33" text-anchor="middle" fill="rgba(255,255,255,0.25)"
    font-size="22" font-weight="900" font-family="Arial Black, Arial, sans-serif">CM</text>
  <!-- Compass needle -->
  <circle cx="30" cy="51" r="2.5" fill="rgba(255,255,255,0.85)" />
  <polygon points="28.5,51 30,47 31.5,51" fill="rgba(255,255,255,0.85)" />
</svg>
